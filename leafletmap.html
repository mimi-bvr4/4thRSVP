<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking &amp; Route — The Bridge Building</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Rye&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0b1437;font-family:Montserrat,sans-serif;}
  #wrap{width:1200px;height:860px;position:relative;background:#0b1437;}
  #head{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #head .k{color:#f5c542;font-size:18px;font-weight:800;letter-spacing:5px;}
  #head .t{color:#fff;font-family:Rye,serif;font-size:28px;margin-top:4px;}
  #map{width:1200px;height:600px;}
  #banner{height:84px;margin:16px 40px 0;background:#c8102e;border:3px solid #f5c542;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #banner .b1{color:#fff;font-size:21px;font-weight:900;}
  #banner .b2{color:#ffe9b0;font-size:14px;font-weight:700;margin-top:4px;}
  /* custom markers */
  .pin{display:flex;align-items:center;gap:0;}
  .park-pin{background:#f5c542;color:#0b1437;border:3px solid #fff;border-radius:50%;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .park-lbl{background:#16224f;color:#fff;border:2px solid #f5c542;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .star-pin{color:#f5c542;font-size:46px;line-height:1;text-shadow:0 0 4px #fff,0 3px 8px rgba(0,0,0,.6);}
  .venue-lbl{background:#c8102e;color:#fff;border:2px solid #f5c542;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .walk-lbl{background:rgba(11,20,55,.92);color:#f5c542;border:1px solid #f5c542;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:800;white-space:nowrap;}
  .leaflet-container{background:#0b1437;}
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <div class="k">PARKING &amp; HOW TO GET IN</div>
    <div class="t">The Bridge Building &middot; 2 Victory Ave</div>
  </div>
  <div id="map"></div>
  <div id="banner">
    <div class="b1">&#9201;&#65039; BE PARKED &amp; WALKING IN BEFORE 8:00 PM</div>
    <div class="b2">At 8 PM the fire marshal secures the site &mdash; this is the only entrance, so arrive early.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // coordinates (tuned visually)
  var VENUE = [36.16285, -86.77160];   // The Bridge Building (foot of pedestrian bridge)
  var PARK  = [36.16130, -86.76955];   // gated lot under Korean Veterans Blvd Bridge

  var map = L.map('map', { zoomControl:false, attributionControl:true, scrollWheelZoom:false, zoomSnap:0.25 })
    .setView([36.16205, -86.76930], 17.5);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, crossOrigin: 'anonymous',
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // walking path (approx along the East Bank Greenway)
  L.polyline([PARK, [36.16190,-86.77020], [36.16245,-86.77090], VENUE], {
    color:'#f5c542', weight:5, dashArray:'2 10', lineCap:'round'
  }).addTo(map);

  // PARK marker
  L.marker(PARK, { icon: L.divIcon({ className:'', html:
    '<div class="pin"><div class="park-pin">P</div><div class="park-lbl">PARK &mdash; gated lot<br>under the bridge</div></div>',
    iconSize:[220,46], iconAnchor:[23,23] }) }).addTo(map);

  // VENUE marker
  L.marker(VENUE, { icon: L.divIcon({ className:'', html:
    '<div style="display:flex;align-items:center;gap:6px;"><div class="star-pin">&#9733;</div><div class="venue-lbl">THE BRIDGE BUILDING<br>&#9733; the only way in</div></div>',
    iconSize:[230,46], iconAnchor:[23,46] }) }).addTo(map);

  // walk label
  L.marker([36.16235,-86.77055], { icon: L.divIcon({ className:'', html:
    '<div class="walk-lbl">&#128694; WALK THE RIVERFRONT</div>', iconSize:[160,20], iconAnchor:[80,10] }) }).addTo(map);

  window.__mapReady = false;
  map.whenReady(function(){ setTimeout(function(){ window.__mapReady = true; }, 1200); });
</script>
</body>
</html>
