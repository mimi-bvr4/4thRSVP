<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Route map — render source</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Rye&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0b1437;}
  .stage{width:1200px;height:900px;position:relative;overflow:hidden;background:#0b1437;font-family:Montserrat,sans-serif;}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0d1845"/><stop offset="1" stop-color="#0a1030"/>
      </linearGradient>
      <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1d4ea8"/><stop offset="1" stop-color="#12306e"/>
      </linearGradient>
      <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e2253f"/><stop offset="1" stop-color="#c8102e"/>
      </linearGradient>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#f5c542"/>
      </marker>
    </defs>

    <rect width="1200" height="900" fill="url(#sky)"/>

    <!-- title -->
    <text x="600" y="58" text-anchor="middle" fill="#f5c542" font-size="22" font-weight="800" letter-spacing="6">PARKING &amp; HOW TO GET IN</text>
    <text x="600" y="98" text-anchor="middle" fill="#ffffff" font-family="Rye, serif" font-size="32">The Bridge Building &#183; 2 Victory Ave</text>

    <!-- ===== SCHEMATIC MAP (y 120-560) ===== -->
    <!-- river band: top-center down to bottom-left; east bank = right -->
    <polygon points="520,120 660,120 300,560 60,560" fill="url(#river)"/>
    <polygon points="520,120 660,120 300,560 60,560" fill="none" stroke="#3b6fd0" stroke-width="2" opacity=".5"/>
    <text x="250" y="430" fill="#9fc0ff" font-size="18" font-weight="700" opacity=".85" transform="rotate(-50 250 430)">CUMBERLAND RIVER</text>

    <!-- west bank -->
    <text x="120" y="250" fill="#8fa6d8" font-size="18" font-weight="800" letter-spacing="2">DOWNTOWN</text>
    <text x="120" y="272" fill="#6f86b8" font-size="12" font-weight="600">(west bank)</text>

    <!-- KVB bridge across the river -->
    <g transform="rotate(33 470 330)">
      <rect x="300" y="312" width="360" height="40" rx="6" fill="#cdd6e6" stroke="#9aa6bd" stroke-width="2"/>
      <text x="480" y="338" fill="#0b1437" font-size="14" font-weight="800" text-anchor="middle">KOREAN VETERANS BLVD BRIDGE</text>
    </g>

    <!-- PARK HERE pin (east side, under the bridge) -->
    <g>
      <rect x="560" y="392" width="280" height="118" rx="12" fill="#16224f" stroke="#f5c542" stroke-width="3"/>
      <circle cx="606" cy="438" r="26" fill="#f5c542"/>
      <text x="606" y="448" text-anchor="middle" fill="#0b1437" font-size="30" font-weight="900">P</text>
      <text x="648" y="430" fill="#ffffff" font-size="18" font-weight="800">PARK HERE</text>
      <text x="648" y="452" fill="#cfe0ff" font-size="12.5" font-weight="600">Gated lot under the bridge</text>
      <text x="648" y="471" fill="#cfe0ff" font-size="12.5" font-weight="600">on your left &#183; attendant directs you</text>
      <text x="648" y="495" fill="#9fb4dd" font-size="11.5" font-weight="600">(east bank)</text>
    </g>

    <!-- walking path: dashed gold from lot up to building -->
    <path d="M720,392 C800,320 860,270 920,236" fill="none" stroke="#f5c542" stroke-width="5" stroke-dasharray="2 11" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="812" y="300" text-anchor="middle" fill="#f5c542" font-size="14" font-weight="800" transform="rotate(-35 812 300)">&#128694; WALK THE RIVERFRONT</text>

    <!-- The Bridge Building marker (upper right) -->
    <rect x="800" y="150" width="300" height="36" rx="9" fill="#c8102e" stroke="#f5c542" stroke-width="2"/>
    <text x="950" y="174" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="900">THE BRIDGE BUILDING</text>
    <polygon points="950,196 962,228 996,228 968,248 979,282 950,262 921,282 932,248 904,228 938,228"
             fill="#f5c542" stroke="#fff" stroke-width="1.5"/>
    <text x="950" y="306" text-anchor="middle" fill="#f5c542" font-size="15" font-weight="900">&#9733; THE ONLY WAY IN &#9733;</text>

    <!-- ===== DRIVING ROUTE RIBBON (y 600-720) ===== -->
    <text x="600" y="610" text-anchor="middle" fill="#f5c542" font-size="18" font-weight="800" letter-spacing="2">DRIVING ROUTE</text>
    <g font-size="15" font-weight="800" text-anchor="middle">
      <rect x="64"   y="640" width="180" height="60" rx="14" fill="url(#ribbon)" stroke="#f5c542" stroke-width="2"/>
      <text x="154" y="668" fill="#fff">From I-65</text>
      <text x="154" y="688" fill="#ffe9b0" font-size="12">take the&#8230;</text>

      <rect x="276"  y="640" width="200" height="60" rx="14" fill="#16224f" stroke="#f5c542" stroke-width="2"/>
      <text x="376" y="668" fill="#fff">Shelby Street</text>
      <text x="376" y="688" fill="#cfe0ff" font-size="12">exit</text>

      <rect x="508"  y="640" width="190" height="60" rx="14" fill="#16224f" stroke="#f5c542" stroke-width="2"/>
      <text x="603" y="668" fill="#fff">S. 5th Street</text>
      <text x="603" y="688" fill="#cfe0ff" font-size="12">continue onto</text>

      <rect x="730"  y="640" width="220" height="60" rx="14" fill="#16224f" stroke="#f5c542" stroke-width="2"/>
      <text x="840" y="668" fill="#fff">Right on Davidson</text>
      <text x="840" y="688" fill="#cfe0ff" font-size="12">turn right</text>

      <rect x="982"  y="640" width="172" height="60" rx="14" fill="#1f7a1f" stroke="#f5c542" stroke-width="2"/>
      <text x="1068" y="668" fill="#fff">Gated lot</text>
      <text x="1068" y="688" fill="#d8ffd8" font-size="12">under the bridge</text>
    </g>
    <g stroke="#f5c542" stroke-width="3" marker-end="url(#arrow)">
      <line x1="246" y1="670" x2="272" y2="670"/>
      <line x1="478" y1="670" x2="504" y2="670"/>
      <line x1="700" y1="670" x2="726" y2="670"/>
      <line x1="952" y1="670" x2="978" y2="670"/>
    </g>

    <!-- ===== TIMING BANNER ===== -->
    <rect x="150" y="772" width="900" height="84" rx="16" fill="#c8102e" stroke="#f5c542" stroke-width="3"/>
    <text x="600" y="808" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">&#9201;&#65039; BE PARKED &amp; WALKING IN BEFORE 8:00 PM</text>
    <text x="600" y="836" text-anchor="middle" fill="#ffe9b0" font-size="14.5" font-weight="700">At 8 PM the fire marshal secures the site &#8212; this is the only entrance, so arrive early.</text>
  </svg>
</div>
</body>
</html>
