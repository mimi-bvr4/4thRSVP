<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b1437;font-family:Montserrat,sans-serif;}
  #map{width:100%;height:100%;}
  .leaflet-container{background:#0b1437;}
  .park-pin{background:#f5c542;color:#0b1437;border:3px solid #fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .park-lbl{background:#16224f;color:#fff;border:2px solid #f5c542;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .star-pin{color:#f5c542;font-size:44px;line-height:1;text-shadow:0 0 4px #fff,0 3px 8px rgba(0,0,0,.6);}
  .venue-lbl{background:#c8102e;color:#fff;border:2px solid #f5c542;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.5);}
  .walk-lbl{background:rgba(11,20,55,.92);color:#f5c542;border:1px solid #f5c542;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;white-space:nowrap;}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  var VENUE=[36.16285,-86.77160], PARK=[36.16130,-86.76955];
  var map=L.map('map',{zoomControl:true,scrollWheelZoom:false,zoomSnap:0.25}).setView([36.16195,-86.76945],17);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  L.polyline([PARK,[36.16190,-86.77020],[36.16245,-86.77090],VENUE],{color:'#f5c542',weight:5,dashArray:'2 10',lineCap:'round'}).addTo(map);
  L.marker(PARK,{icon:L.divIcon({className:'',html:'<div style="display:flex;align-items:center;gap:0"><div class="park-pin">P</div><div class="park-lbl">PARK &mdash; gated lot<br>under the bridge</div></div>',iconSize:[210,44],iconAnchor:[22,22]})}).addTo(map);
  L.marker(VENUE,{icon:L.divIcon({className:'',html:'<div style="display:flex;align-items:center;gap:6px"><div class="star-pin">&#9733;</div><div class="venue-lbl">THE BRIDGE BUILDING<br>&#9733; the only way in</div></div>',iconSize:[220,44],iconAnchor:[22,44]})}).addTo(map);
  L.marker([36.16235,-86.77055],{icon:L.divIcon({className:'',html:'<div class="walk-lbl">&#128694; WALK THE RIVERFRONT</div>',iconSize:[150,18],iconAnchor:[75,9]})}).addTo(map);
</script>
</body>
</html>
