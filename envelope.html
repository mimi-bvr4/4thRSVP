<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Envelope — render source</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Rye&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b1437; }
  /* fixed 1200x900 stage = crisp 2x for a 600x450 email image */
  .stage {
    width: 1200px; height: 900px; position: relative; overflow: hidden;
    background: #0b1437;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(200,16,46,.25) 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(245,197,66,.20) 0%, transparent 45%),
      radial-gradient(circle at 50% 95%, rgba(60,90,200,.30) 0%, transparent 55%);
    font-family: 'Montserrat', sans-serif;
  }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  .spark {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    background:
      radial-gradient(circle, rgba(245,197,66,.95) 0%, rgba(245,197,66,.35) 18%, transparent 45%),
      repeating-conic-gradient(rgba(245,197,66,.85) 0deg 2deg, transparent 2deg 24deg);
    -webkit-mask: radial-gradient(circle, #000 0%, #000 55%, transparent 72%);
    mask: radial-gradient(circle, #000 0%, #000 55%, transparent 72%);
  }
  .spark.red { filter: hue-rotate(-45deg) saturate(1.6); }
  .spark.blue { filter: hue-rotate(170deg); }

  .kicker {
    position: absolute; top: 56px; width: 100%; text-align: center;
    color: #f5c542; font-weight: 800; font-size: 26px;
    letter-spacing: .42em; text-transform: uppercase;
  }
  .headline {
    position: absolute; top: 100px; width: 100%; text-align: center;
    font-family: 'Rye', serif; font-size: 64px; color: #fff;
    text-shadow: 0 4px 0 #c8102e, 0 8px 24px rgba(0,0,0,.6);
  }

  /* invite card peeking out of envelope */
  .peek {
    position: absolute; left: 50%; top: 235px; transform: translateX(-50%) rotate(-2deg);
    width: 430px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 4px #f5c542, 0 16px 40px rgba(0,0,0,.6);
    line-height: 0;
  }
  .peek img { width: 100%; }

  /* envelope front */
  .env {
    position: absolute; left: 50%; top: 470px; transform: translateX(-50%);
    width: 760px; height: 340px; border-radius: 10px;
    background: linear-gradient(180deg, #fdf6e3, #f3e5c0);
    box-shadow: 0 24px 60px rgba(0,0,0,.65);
    overflow: hidden;
  }
  /* bunting trim borders */
  .trim { position: absolute; left: 0; right: 0; height: 16px;
    background: repeating-linear-gradient(90deg, #c8102e 0 40px, #fff 40px 80px, #1f3a93 80px 120px); }
  .trim.top { top: 0; } .trim.bot { bottom: 0; }
  /* envelope flap */
  .flap {
    position: absolute; top: 16px; left: 0; width: 0; height: 0;
    border-left: 380px solid transparent; border-right: 380px solid transparent;
    border-top: 185px solid #efe0b8;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,.18));
  }
  /* wax seal */
  .seal {
    position: absolute; left: 50%; top: 96px; transform: translateX(-50%);
    width: 118px; height: 118px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #e2253f, #a30c24 70%);
    box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 0 0 9px rgba(245,197,66,.9);
    display: flex; align-items: center; justify-content: center;
    color: #f5c542; font-size: 42px; font-family: 'Rye', serif;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .env .addr {
    position: absolute; bottom: 44px; width: 100%; text-align: center;
    color: #5a3e1b; font-weight: 800; font-size: 25px; letter-spacing: .06em; white-space: nowrap; bottom: 52px;
  }
  .cta {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: linear-gradient(180deg, #e2253f, #c8102e);
    color: #fff; font-weight: 900; font-size: 32px; letter-spacing: .08em;
    text-transform: uppercase; padding: 20px 56px; border-radius: 16px;
    box-shadow: 0 0 0 4px #f5c542, 0 12px 30px rgba(200,16,46,.6);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="kicker">Infinity Hospitality Group presents</div>
  <div class="headline">The All-American 250th</div>

  <div class="spark" style="left:60px;top:210px;"></div>
  <div class="spark red" style="right:70px;top:170px;width:150px;height:150px;"></div>
  <div class="spark blue" style="left:110px;top:560px;width:90px;height:90px;"></div>
  <div class="spark red" style="right:110px;top:600px;width:110px;height:110px;"></div>
  <div class="spark blue" style="right:240px;top:330px;width:70px;height:70px;"></div>
  <div class="spark" style="left:230px;top:380px;width:60px;height:60px;"></div>

  <div class="peek"><img src="fourth.jpg" alt=""></div>

  <div class="env">
    <div class="trim top"></div>
    <div class="flap"></div>
    <div class="seal">250</div>
    <div class="addr">★ You're Invited · July 4th · The Bridge Building ★</div>
    <div class="trim bot"></div>
  </div>

  <div class="cta">★ Tap to open your invitation ★</div>

  <script>
    for (var i = 0; i < 70; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      var sz = 2 + Math.random() * 4;
      s.style.width = s.style.height = sz + 'px';
      s.style.left = Math.random() * 1200 + 'px';
      s.style.top = Math.random() * 900 + 'px';
      s.style.opacity = .25 + Math.random() * .65;
      document.getElementById('stage').appendChild(s);
    }
  </script>
</div>
</body>
</html>
